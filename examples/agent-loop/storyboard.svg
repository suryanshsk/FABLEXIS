<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="100%" height="100%" fill="#0B1020"/><text x="40" y="50" font-family="Arial" font-size="30" fill="#F4EBDD">Fablexis storyboard</text><rect x="40" y="40" width="1000" height="190" rx="18" fill="#F4EBDD" stroke="#F15A4A" stroke-width="4"/><text x="70" y="85" font-family="Arial" font-size="28" font-weight="700" fill="#0B1020">scene-01  kinetic typography</text><text x="70" y="130" font-family="Arial" font-size="22" fill="#0B1020">AI agents turn goals into steps.</text><text x="70" y="180" font-family="Arial" font-size="18" fill="#555">"hook"  0.0s - 3.0s</text><rect x="40" y="270" width="1000" height="190" rx="18" fill="#F4EBDD" stroke="#F15A4A" stroke-width="4"/><text x="70" y="315" font-family="Arial" font-size="28" font-weight="700" fill="#0B1020">scene-02  geometric infographic</text><text x="70" y="360" font-family="Arial" font-size="22" fill="#0B1020">A data chart shows each step.</text><text x="70" y="410" font-family="Arial" font-size="18" fill="#555">"develop the argument"  3.0s - 6.0s</text><rect x="40" y="500" width="1000" height="190" rx="18" fill="#F4EBDD" stroke="#F15A4A" stroke-width="4"/><text x="70" y="545" font-family="Arial" font-size="28" font-weight="700" fill="#0B1020">scene-03  dimensional diagram</text><text x="70" y="590" font-family="Arial" font-size="22" fill="#0B1020">Technology makes the loop visible.</text><text x="70" y="640" font-family="Arial" font-size="18" fill="#555">"develop the argument"  6.0s - 9.0s</text><rect x="40" y="730" width="1000" height="190" rx="18" fill="#F4EBDD" stroke="#F15A4A" stroke-width="4"/><text x="70" y="775" font-family="Arial" font-size="28" font-weight="700" fill="#0B1020">scene-04  editorial collage</text><text x="70" y="820" font-family="Arial" font-size="22" fill="#0B1020">Why does judgment still matter?</text><text x="70" y="870" font-family="Arial" font-size="18" fill="#555">"develop the argument"  9.0s - 12.0s</text><rect x="40" y="960" width="1000" height="190" rx="18" fill="#F4EBDD" stroke="#F15A4A" stroke-width="4"/><text x="70" y="1005" font-family="Arial" font-size="28" font-weight="700" fill="#0B1020">scene-05  editorial collage</text><text x="70" y="1050" font-family="Arial" font-size="22" fill="#0B1020">It closes the loop.</text><text x="70" y="1100" font-family="Arial" font-size="18" fill="#555">"conclusion"  12.0s - 15.0s</text></svg>