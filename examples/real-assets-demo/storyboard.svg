<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="100%" height="100%" fill="#0B1020"/><text x="40" y="50" font-family="Arial" font-size="30" fill="#F4EBDD">Fablexis storyboard</text><rect x="40" y="40" width="1000" height="190" rx="18" fill="#F4EBDD" stroke="#F15A4A" stroke-width="4"/><text x="70" y="85" font-family="Arial" font-size="28" font-weight="700" fill="#0B1020">scene-01  kinetic typography</text><text x="70" y="130" font-family="Arial" font-size="22" fill="#0B1020">Ideas become visible.</text><text x="70" y="180" font-family="Arial" font-size="18" fill="#555">"hook"  0.0s - 3.0s</text><rect x="40" y="270" width="1000" height="190" rx="18" fill="#F4EBDD" stroke="#F15A4A" stroke-width="4"/><text x="70" y="315" font-family="Arial" font-size="28" font-weight="700" fill="#0B1020">scene-02  editorial collage</text><text x="70" y="360" font-family="Arial" font-size="22" fill="#0B1020">A field note gives the story a human scale.</text><text x="70" y="410" font-family="Arial" font-size="18" fill="#555">"develop the argument"  3.0s - 6.6s</text><rect x="40" y="500" width="1000" height="190" rx="18" fill="#F4EBDD" stroke="#F15A4A" stroke-width="4"/><text x="70" y="545" font-family="Arial" font-size="28" font-weight="700" fill="#0B1020">scene-03  geometric infographic</text><text x="70" y="590" font-family="Arial" font-size="22" fill="#0B1020">Data reveals the pattern.</text><text x="70" y="640" font-family="Arial" font-size="18" fill="#555">"develop the argument"  6.6s - 9.6s</text><rect x="40" y="730" width="1000" height="190" rx="18" fill="#F4EBDD" stroke="#F15A4A" stroke-width="4"/><text x="70" y="775" font-family="Arial" font-size="28" font-weight="700" fill="#0B1020">scene-04  kinetic typography</text><text x="70" y="820" font-family="Arial" font-size="22" fill="#0B1020">Systems connect the evidence.</text><text x="70" y="870" font-family="Arial" font-size="18" fill="#555">"develop the argument"  9.6s - 12.6s