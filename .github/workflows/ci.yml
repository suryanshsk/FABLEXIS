name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python validate.py
      - run: python -m engine.cli plan examples/ipo-input.md --output /tmp/fablexis-out
      - run: python -m engine.cli render /tmp/fablexis-out/blueprint.json --output /tmp/fablexis-out
