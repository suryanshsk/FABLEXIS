name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e .
      - run: ffmpeg -version && ffprobe -version
      - run: python -m engine.cli --help
      - run: python -m engine.cli render-timeline --help
      - run: python -m unittest discover -s tests -v
      - run: python validate.py
      - run: python -m engine.cli plan examples/ipo-input.md --output /tmp/fablexis-out
      - run: python -m engine.cli render /tmp/fablexis-out/blueprint.json --output /tmp/fablexis-out
