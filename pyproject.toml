[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fablexis"
version = "0.2.0"
description = "Open-source, AI-agent-installable video-production skill pack backed by a local rendering engine"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["Pillow>=10.0"]

[project.scripts]
fablexis = "engine.cli:main"
motionforge = "engine.cli:main"

[tool.setuptools]
packages = ["engine"]
